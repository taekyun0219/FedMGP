DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 16

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.001
  LR_SCHEDULER: "single_step"
  ROUND: 10
  MAX_EPOCH: 2
  WARMUP_EPOCH: 0
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
  GAMMA: 1

TRAIN:
  PRINT_FREQ: 5

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
    PRETRAINED: True

DATASET:
  SUBSAMPLE_CLASSES: "base"
  USERS: 10
  IID: False
  FRAC: 1.0
  PARTITION: "noniid-labeldir"
  USEALL: False
  NUM_SHOTS: 4
  BETA: 0.3
  REPEATRATE: 0.0
  IMBALANCE_TRAIN: False
  SPLIT_CLIENT: False

TRAINER:
  FEDMOPG:
    N_CTX: 4
    D_CTX: 1
    DEPTH: 0
    NUM_PROMPT_PAIRS: 4
    CROSS_HEADS: 4
    SELF_HEADS: 4
    PREC: "fp16"
    USE_DIVERGENT_LOSS: False
    DIVERGENT_LOSS_WEIGHT: 0.1
    DIVERGENT_LOSS_TYPE: "cos"
